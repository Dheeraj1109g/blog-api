# Render blueprint for the Blog API (FastAPI backend).
# Deploy: New + -> Blueprint -> connect this repo, then push.
services:
  - type: web
    name: blog-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
